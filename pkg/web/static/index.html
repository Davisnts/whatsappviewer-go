<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <div class="avatar my-avatar">WA</div>
          <div class="user-meta">
            <span class="user-title">WhatsApp Viewer</span>
            <span class="status-badge" id="dbStatusBadge">Carregando...</span>
          </div>
        </div>
      </header>

      <!-- Search bar -->
      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="chatSearchInput" placeholder="Pesquisar conversas..." autocomplete="off">
        </div>
      </div>

      <!-- Chat list -->
      <div class="chats-list" id="chatsList">
        <div class="loading-spinner">Carregando conversas...</div>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-main" id="chatMain">
      <!-- Empty state when no chat is selected -->
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">
          <svg viewBox="0 0 24 24" width="72" height="72">
            <path fill="#00a884" d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.08L2 22l5.06-1.33C8.52 21.52 10.21 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.61 0-3.12-.47-4.41-1.28l-.32-.2-3.03.8 1.05-2.95-.21-.34C4.31 14.8 3.8 13.45 3.8 12 3.8 7.48 7.48 3.8 12 3.8s8.2 3.68 8.2 8.2-3.68 8.2-8.2 8.2z"/>
          </svg>
        </div>
        <h2>WhatsApp Viewer para Go</h2>
        <p>Selecione uma conversa ao lado para visualizar o histórico de mensagens, imagens e citações.</p>
      </div>

      <!-- Active Chat Area -->
      <div class="active-chat-wrapper" id="activeChatWrapper" style="display: none;">
        <!-- Header -->
        <header class="chat-header">
          <div class="chat-info-block">
            <button class="btn-back" id="btnBackMobile" title="Voltar">←</button>
            <div class="avatar" id="activeChatAvatar">?</div>
            <div class="active-chat-meta">
              <h3 id="activeChatTitle">Nome da Conversa</h3>
              <span id="activeChatSubtitle">JID</span>
            </div>
          </div>
          <div class="chat-actions">
            <!-- Export dropdown / buttons -->
            <button class="action-btn" id="btnExportHtml" title="Exportar para HTML">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span>HTML</span>
            </button>
            <button class="action-btn" id="btnExportJson" title="Exportar para JSON">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span>JSON</span>
            </button>
            <button class="action-btn" id="btnExportTxt" title="Exportar para TXT">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span>TXT</span>
            </button>
          </div>
        </header>

        <!-- Messages stream -->
        <div class="messages-viewport" id="messagesViewport">
          <div class="messages-content" id="messagesContent"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
